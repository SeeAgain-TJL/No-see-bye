# Place limit_req_zone in nginx http {}. Configure HTTPS before public use.
limit_req_zone $binary_remote_addr zone=memory_auth:10m rate=5r/m;
server {
    listen 80;
    server_name memories.example.com;
    client_max_body_size 201m;
    client_body_timeout 300s;
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=memory_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

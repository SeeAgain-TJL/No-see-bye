name: Linux deployment bundle

concurrency:
  group: no-see-bye-production
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    # Match the ECS architecture and glibc/OpenSSL family. This job targets x86_64.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: file:/tmp/no-see-bye-build.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run build
      - run: npm run check
      - run: npm run test:layout
      - name: Check deployment backup and rollback
        run: bash scripts/test-deploy.sh
      - run: npm run release:pack
      # Test the extracted archive outside the checkout so missing dependencies
      # cannot be resolved accidentally from the source node_modules directory.
      - name: Verify isolated deployment archive
        shell: bash
        run: |
          bundle_dir=$(mktemp -d)
          trap 'rm -rf "$bundle_dir"' EXIT
          cd dist
          sha256sum -c no-see-bye-linux-x64.tar.gz.sha256
          tar -xzf no-see-bye-linux-x64.tar.gz -C "$bundle_dir"
          cd ..
          TEST_RELEASE_DIR="$bundle_dir/no-see-bye" npm run test:integration
          TEST_RELEASE_DIR="$bundle_dir/no-see-bye" npm run test:security
          sed "s#/root/no-see-bye#$bundle_dir/no-see-bye#g" "$bundle_dir/no-see-bye/deploy/systemd/no-see-bye.service" > "$bundle_dir/no-see-bye-test.service"
          systemd-analyze verify --man=no "$bundle_dir/no-see-bye-test.service"
      - uses: actions/upload-artifact@v4
        with:
          name: no-see-bye-linux-x64
          path: |
            dist/no-see-bye-linux-x64.tar.gz
            dist/no-see-bye-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  deploy:
    name: Deploy production
    needs: package
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: no-see-bye-linux-x64
          path: release
      - name: Install deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/no-see-bye-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/no-see-bye-deploy ~/.ssh/known_hosts
      - name: Upload and activate verified release
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c no-see-bye-linux-x64.tar.gz.sha256
          digest=$(sha256sum no-see-bye-linux-x64.tar.gz | cut -d ' ' -f 1)
          ssh -i ~/.ssh/no-see-bye-deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $digest $GITHUB_SHA" \
            < no-see-bye-linux-x64.tar.gz
      - name: Probe Internet connectivity from runner
        shell: bash
        run: |
          if ! curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --retry 2 --retry-delay 3 --retry-all-errors https://life.tingjieli.shop/api/health; then
            echo '::warning::Runner Internet probe failed. The deployed application and local Nginx HTTPS checks passed; check external routing separately.'
          fi
      - name: Remove deployment credentials
        if: always()
        shell: bash
        run: rm -f ~/.ssh/no-see-bye-deploy
